name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-type: simple

  build-artifacts:
    name: Build and upload release artifacts
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v3.0.0
        with:
          context: .
          file: Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: wsld-builder:latest
          push: false
          load: true
          outputs: type=local,dest=./artifacts

      - name: Package artifacts (zip/tar.gz)
        run: |
          set -eux
          mkdir -p dist
          tar -C artifacts -czf dist/wsld-linux-x86_64.tar.gz wsld
          zip -j dist/wsld-windows-x86_64.zip artifacts/wsldhost.exe artifacts/WebView2Loader.dll

      - name: Upload Actions artifact (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: wsld-linux-x86_64
          path: dist/wsld-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Upload Actions artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: wsld-windows-x86_64
          path: dist/wsld-windows-x86_64.zip
          if-no-files-found: error

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            dist/wsld-linux-x86_64.tar.gz
            dist/wsld-windows-x86_64.zip
